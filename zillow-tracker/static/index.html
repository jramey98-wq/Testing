<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zillow Price Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo">
                Price Tracker
                <span>Zillow Listing vs Prior Sale</span>
            </div>
            <div class="search-box">
                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="Search any address, city, state, or ZIP code" autocomplete="off">
                    <div class="suggestions" id="suggestions"></div>
                </div>
                <button id="search-btn">Search</button>
            </div>
            <span class="demo-badge" id="demo-badge" style="display:none">Demo Mode</span>
            <span class="source-badge" id="source-badge" style="display:none">Live</span>
        </div>
    </header>

    <main>
        <div class="status-bar" id="status-bar" style="display:none">
            <span class="result-count" id="result-count"></span>
            <div class="sort-controls">
                <button class="sort-btn active" data-sort="pct_desc">% Gain &#9660;</button>
                <button class="sort-btn" data-sort="pct_asc">% Gain &#9650;</button>
                <button class="sort-btn" data-sort="price_desc">Price &#9660;</button>
                <button class="sort-btn" data-sort="price_asc">Price &#9650;</button>
                <button class="sort-btn" data-sort="change_desc">$ Change</button>
            </div>
        </div>

        <div id="results">
            <div class="empty-state">
                <h2>Find the Biggest Price Jumps</h2>
                <p>Search any address, city, or ZIP code to see current listings compared to their last sale price.</p>
                <div class="search-examples">
                    <p class="examples-label">Try searching:</p>
                    <div class="example-chips">
                        <button class="example-chip" data-query="742 Evergreen Terrace, Springfield, IL">742 Evergreen Terrace, Springfield, IL</button>
                        <button class="example-chip" data-query="1600 Pennsylvania Ave, Washington, DC">1600 Pennsylvania Ave, Washington, DC</button>
                        <button class="example-chip" data-query="123 Main St, Austin, TX">123 Main St, Austin, TX</button>
                    </div>
                </div>
                <div class="popular-cities" id="popular-cities"></div>
            </div>
        </div>
    </main>

    <!-- Price History Modal -->
    <div class="modal-overlay" id="history-modal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Price History</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="chart-container" id="chart-container">
                    <canvas id="history-chart"></canvas>
                </div>
                <div class="history-table-wrap">
                    <table class="history-table" id="history-table">
                        <thead><tr><th>Date</th><th>Price</th><th>Change</th></tr></thead>
                        <tbody id="history-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
