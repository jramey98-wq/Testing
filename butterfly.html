<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Butterfly</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, #90ee90 100%);
      overflow: hidden;
      height: 100vh;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Particle system for sparkles
const particles = [];

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2 - 1;
    this.life = 1;
    this.decay = 0.02 + Math.random() * 0.03;
    this.size = 2 + Math.random() * 3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Butterfly state
const butterfly = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  targetX: canvas.width / 2,
  targetY: canvas.height / 2,
  vx: 0,
  vy: 0,
  angle: 0,       // body tilt
  wingAngle: 0,   // flap phase
  flapSpeed: 0.18,
  speed: 2.5,
  scale: 1,
};

// Periodically pick a new target to float toward
function newTarget() {
  butterfly.targetX = 80 + Math.random() * (canvas.width - 160);
  butterfly.targetY = 80 + Math.random() * (canvas.height * 0.7);
}
newTarget();
setInterval(newTarget, 3000);

// Draw one wing (mirrored for the other)
function drawWing(flip, flapAngle, scale) {
  ctx.save();
  ctx.scale(flip, 1);

  // Wing fold in 3D: horizontal scale based on cosine of flapAngle
  const flapScale = Math.cos(flapAngle);

  ctx.save();
  ctx.scale(flapScale, 1);

  // --- Upper wing ---
  const grad1 = ctx.createRadialGradient(30, -20, 5, 30, -20, 90);
  grad1.addColorStop(0, 'rgba(255,120,200,0.95)');
  grad1.addColorStop(0.4, 'rgba(220,80,180,0.9)');
  grad1.addColorStop(0.75, 'rgba(150,0,130,0.85)');
  grad1.addColorStop(1, 'rgba(80,0,80,0.6)');

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(10, -60, 90, -100, 110, -60);
  ctx.bezierCurveTo(130, -20, 100, 30, 0, 10);
  ctx.closePath();
  ctx.fillStyle = grad1;
  ctx.fill();

  // Upper wing veins
  ctx.strokeStyle = 'rgba(180,0,150,0.35)';
  ctx.lineWidth = 0.8;
  [[0,0,60,-70],[0,0,90,-30],[0,5,40,-10]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });

  // Upper wing spots
  ctx.fillStyle = 'rgba(255,220,100,0.7)';
  [[55,-65,6],[90,-45,5],[70,-20,4]].forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  [[55,-65,2.5],[90,-45,2]].forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  });

  // --- Lower wing ---
  const grad2 = ctx.createRadialGradient(20, 30, 5, 20, 30, 80);
  grad2.addColorStop(0, 'rgba(255,140,210,0.9)');
  grad2.addColorStop(0.5, 'rgba(190,60,160,0.85)');
  grad2.addColorStop(1, 'rgba(80,0,80,0.55)');

  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.bezierCurveTo(10, 20, 80, 80, 70, 90);
  ctx.bezierCurveTo(50, 105, 10, 80, -5, 50);
  ctx.bezierCurveTo(-10, 30, -5, 10, 0, 10);
  ctx.closePath();
  ctx.fillStyle = grad2;
  ctx.fill();

  // Lower wing spots
  ctx.fillStyle = 'rgba(255,220,100,0.65)';
  [[45,70,5],[25,85,4]].forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  });

  // Wing border shimmer
  ctx.strokeStyle = 'rgba(255,180,230,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(10, -60, 90, -100, 110, -60);
  ctx.bezierCurveTo(130, -20, 100, 30, 0, 10);
  ctx.stroke();

  ctx.restore();
  ctx.restore();
}

// Draw the butterfly body
function drawBody(scale) {
  // Abdomen
  const bodyGrad = ctx.createLinearGradient(-4, -40, 4, 60);
  bodyGrad.addColorStop(0, '#3a003a');
  bodyGrad.addColorStop(0.4, '#7a1060');
  bodyGrad.addColorStop(1, '#2a0030');
  ctx.beginPath();
  ctx.ellipse(0, 15, 5, 45, 0, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Thorax
  ctx.beginPath();
  ctx.ellipse(0, -5, 7, 12, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#5a0050';
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(0, -18, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#3a003a';
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#ffdd44';
  ctx.beginPath(); ctx.arc(-3, -20, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3, -20, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-3, -20, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3, -20, 1, 0, Math.PI * 2); ctx.fill();

  // Antennae
  ctx.strokeStyle = '#3a003a';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-2,-25); ctx.quadraticCurveTo(-15,-55,-10,-65); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-25);  ctx.quadraticCurveTo(15,-55,10,-65);  ctx.stroke();
  // Antennae tips
  ctx.fillStyle = '#3a003a';
  ctx.beginPath(); ctx.arc(-10,-65,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10,-65,3,0,Math.PI*2); ctx.fill();
}

// Background flowers
const flowers = Array.from({length: 12}, () => ({
  x: Math.random() * canvas.width,
  y: canvas.height * 0.65 + Math.random() * (canvas.height * 0.35),
  r: 6 + Math.random() * 8,
  color: ['#ff88cc','#ffcc44','#ff6699','#ffffff','#ffaaee'][Math.floor(Math.random()*5)],
  stem: 20 + Math.random() * 40,
}));

function drawFlowers() {
  flowers.forEach(f => {
    // Stem
    ctx.strokeStyle = '#228b22';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x, f.y + f.stem); ctx.stroke();
    // Petals
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.ellipse(f.x + Math.cos(a)*f.r, f.y + Math.sin(a)*f.r, f.r*0.7, f.r*0.4, a, 0, Math.PI*2);
      ctx.fill();
    }
    // Center
    ctx.fillStyle = '#ffee00';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.45, 0, Math.PI*2); ctx.fill();
  });
}

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t++;

  // Clear
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Redraw sky gradient (cleared each frame)
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#87ceeb');
  sky.addColorStop(0.6, '#b0e0e6');
  sky.addColorStop(1, '#90ee90');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawFlowers();

  // Steer butterfly toward target with gentle drift
  const dx = butterfly.targetX - butterfly.x;
  const dy = butterfly.targetY - butterfly.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > 5) {
    butterfly.vx += (dx / dist) * 0.12;
    butterfly.vy += (dy / dist) * 0.12;
  }
  // Add gentle sinusoidal drift
  butterfly.vx += Math.sin(t * 0.04) * 0.05;
  butterfly.vy += Math.cos(t * 0.03) * 0.05;

  // Dampen velocity
  butterfly.vx *= 0.94;
  butterfly.vy *= 0.94;

  butterfly.x += butterfly.vx;
  butterfly.y += butterfly.vy;

  // Tilt body in direction of travel
  butterfly.angle = Math.atan2(butterfly.vy, butterfly.vx) + Math.PI / 2;

  // Flap
  butterfly.wingAngle += butterfly.flapSpeed;
  // Speed up flap when moving fast
  const speed = Math.sqrt(butterfly.vx**2 + butterfly.vy**2);
  butterfly.flapSpeed = 0.12 + speed * 0.04;

  // Sparkle trail
  if (t % 4 === 0) {
    const colors = ['#ff99dd','#ffcc44','#ff66bb','#ffffff','#ff44aa'];
    particles.push(new Particle(butterfly.x, butterfly.y, colors[Math.floor(Math.random()*colors.length)]));
  }

  // Update & draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw butterfly
  ctx.save();
  ctx.translate(butterfly.x, butterfly.y);
  ctx.rotate(butterfly.angle - Math.PI / 2);
  ctx.scale(1.1, 1.1);

  // Shadow
  ctx.save();
  ctx.scale(1, 0.3);
  ctx.translate(0, 30);
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 0, 60, 30, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Wings (left = flip:-1, right = flip:1)
  drawWing(-1, butterfly.wingAngle, 1);
  drawWing(1, butterfly.wingAngle, 1);

  // Body on top
  drawBody(1);

  ctx.restore();
}

animate();
</script>
</body>
</html>
